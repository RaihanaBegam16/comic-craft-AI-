<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ComicCraftAI</title>

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >
</head>

<body>

<div class="page">

    <div class="hero">
        <div class="badge">AI COMIC GENERATOR</div>

        <h1>🎨 ComicCraftAI</h1>

        <p>
            Turn your story idea into a beautiful 5-panel comic.
        </p>
    </div>


    <div class="card">

        <form action="/generate" method="post">

            <label>Story Idea</label>

            <textarea
                name="story_idea"
                placeholder="A brave fox explores an enchanted forest"
                required
            >A brave fox explores an enchanted forest</textarea>


            <label>Main Character</label>

            <input
                type="text"
                name="main_character"
                value="Riya, a brave orange fox"
                required
            >


            <label>Setting</label>

            <input
                type="text"
                name="setting"
                value="enchanted forest"
                required
            >


            <label>Tone</label>

            <select name="tone">
                <option>dramatic</option>
                <option>adventure</option>
                <option>funny</option>
                <option>mysterious</option>
                <option>emotional</option>
            </select>


            <label>Art Style</label>

            <input
                type="text"
                name="art_style"
                value="realistic storybook comic"
                required
            >


            <button type="submit">
                ✨ Generate Comic
            </button>

        </form>

    </div>

</div>

<script src="/static/js/app.js"></script>

</body>
</html>
